# Publishes mdre to crates.io when a version tag is pushed.
name: Publish to crates.io

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      # A tag that disagrees with Cargo.toml would publish the wrong version,
      # so fail before anything reaches crates.io.
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF_NAME#v}
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - run: cargo test --locked

      - name: Exchange OIDC token for crates.io publish token
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
