# Installs mdre from the latest GitHub release using the published install
# script (Linux/macOS) or Scoop (Windows), then renders a demo document to
# confirm the binary works.
name: Verify installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - name: Install from the latest release
        run: curl -fsSL https://raw.githubusercontent.com/RakkenTi/mdre/main/install.sh | sh

      - name: Render a demo document
        run: |
          curl -fsSL https://raw.githubusercontent.com/RakkenTi/mdre/main/demo/showcase.md -o demo.md
          export PATH="$HOME/.local/bin:$PATH"
          mdre -r demo.md >/dev/null

  install-windows:
    runs-on: windows-latest
    steps:
      - name: Install mdre via Scoop and render a demo document
        run: |
          irm get.scoop.sh | iex
          scoop bucket add rakkenti https://github.com/RakkenTi/scoop-bucket
          scoop install mdre
          curl.exe -fsSL https://raw.githubusercontent.com/RakkenTi/mdre/main/demo/showcase.md -o demo.md
          mdre -r demo.md > $null
          if ($LASTEXITCODE -ne 0) { throw "mdre failed with exit code $LASTEXITCODE" }
