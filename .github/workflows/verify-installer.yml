# Installs mdre from the latest GitHub release using the published install
# script, then renders a demo document to confirm the binary works.
name: Verify installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - name: Install from the latest release
        run: curl -fsSL https://raw.githubusercontent.com/RakkenTi/mdre/main/install.sh | sh

      - name: Render a demo document
        run: |
          curl -fsSL https://raw.githubusercontent.com/RakkenTi/mdre/main/demo/showcase.md -o demo.md
          export PATH="$HOME/.local/bin:$PATH"
          mdre -r demo.md >/dev/null
